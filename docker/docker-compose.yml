services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: cuad_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../artifacts/qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: cuad_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ../postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mlflow:
    build:
      context: ../docker
      dockerfile: mlflow.Dockerfile
    container_name: cuad_mlflow
    ports:
      - "5001:5000"
    depends_on: 
      - postgres
    command: >
      mlflow server 
        --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        --serve-artifacts
        --artifacts-destination /mlflow/artifacts
        --host 0.0.0.0 
        --port 5000
    volumes:
      - ../mlflow_artifacts:/mlflow/artifacts
    restart: unless-stopped