services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: cuad_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../artifacts/qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: cuad_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ../postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mlflow:
    build:
      context: ../docker
      dockerfile: mlflow.Dockerfile
    container_name: cuad_mlflow
    ports:
      - "5001:5000"
    depends_on: 
      - postgres
    command: >
      mlflow server 
        --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        --serve-artifacts
        --artifacts-destination /mlflow/artifacts
        --host 0.0.0.0 
        --port 5000
    volumes:
      - ../mlflow_artifacts:/mlflow/artifacts
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: cuad_api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - qdrant
    volumes:
      - ../artifacts/chunking:/app/artifacts/chunking
      - ../artifacts/feedback:/app/artifacts/feedback
    restart: unless-stopped