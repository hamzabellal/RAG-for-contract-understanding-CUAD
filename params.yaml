chunking:
  chunk_size : 512
  chunk_overlap : 50
  tokenizer : "BAAI/bge-small-en-v1.5"

embedding:
  embedding_model_name: "BAAI/bge-large-en-v1.5"
  sparse_model_name: "Qdrant/bm25"

retrieval:
  reranker_model_name: "BAAI/bge-reranker-v2-m3"
  embedding_model_name: "BAAI/bge-large-en-v1.5"
  sparse_model_name: "Qdrant/bm25"
  tier1_categories: ["Document Name", "Parties"]
  tier3_categories: ["Ip Ownership Assignment", "Rofr/Rofo/Rofn", "Warranty Duration",
    "Price Restrictions", "Affiliate License-Licensor", "Covenant Not To Sue",
    "Termination For Convenience", "Competitive Restriction Exception",
    "Non-Compete", "Insurance"]
  retrieve_top_k: 10
  sparse_top_k: 10
  rerank_top_n: 3
  retrieve_top_k_tier3: 15
  sparse_top_k_tier3: 15
  rerank_top_n_tier3: 5

generation:
  llm_model_name: "qwen2.5:7b"
  request_timeout: 180
  temperature: 0.0
  use_reasoning: true